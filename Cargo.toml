[package]
name = "sideband-tunes"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Cross-platform system media session discovery for Node.js and Electron"
repository = "https://github.com/sidebandchat/sideband-tunes"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = "0.3"
futures-executor = "0.3"
napi = { version = "3", features = ["async", "napi8", "tokio_rt"] }
napi-derive = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
napi-build = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_WinRT",
] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

