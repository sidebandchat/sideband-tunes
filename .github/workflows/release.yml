name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  NAPI_RS_NATIVE_LIBRARY_PATH: ""

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version) { throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version v' + version) }"
      - run: npm run format:check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            build_args: ""
            smoke_test: true
          - host: windows-2025
            target: aarch64-pc-windows-msvc
            build_args: ""
            smoke_test: false
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_args: --use-napi-cross
            smoke_test: true
          - host: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            build_args: --use-napi-cross
            smoke_test: false
          - host: macos-15
            target: x86_64-apple-darwin
            build_args: ""
            smoke_test: false
          - host: macos-15
            target: aarch64-apple-darwin
            build_args: ""
            smoke_test: true
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Build native binding
        shell: bash
        run: npm run build -- --target ${{ matrix.target }} ${{ matrix.build_args }}
      - name: Smoke test native binding
        if: matrix.smoke_test
        shell: bash
        run: node -e "const tunes = require('./'); console.log(tunes.getPlatformCapabilities())"
      - uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.target }}
          path: sideband-tunes.*.node
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish npm packages and GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v8
        with:
          pattern: binding-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete artifact set
        run: node scripts/verify-release-artifacts.mjs artifacts
      - name: Prepare platform packages
        run: npx napi artifacts --output-dir artifacts
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
